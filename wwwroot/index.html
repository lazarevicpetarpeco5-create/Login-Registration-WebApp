<!DOCTYPE html>
<html lang="en">
  <head>
   <meta charset="UTF-8" />   
   <title>Login Page </title>
   <link rel="stylesheet" href="login-style.css">    
   <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">


   <script type="module" src="windows.js" ></script>
   <script type="module" src="register-validation.js" ></script>
  </head>
<body>
  
 <div>
  <h1 class="login-site-header">LOGIN PAGE</h1>   
  <p class="p-login-here">Login Here</p>
 </div>


 <div class="name-pass">
   <input class="input-username" type="text" placeholder="Username">
   <input class="input-password" type="password" placeholder="password">

   <button id="login-button"    class="login-button">Login</button>
   <button id="forgot-password" class="forgot-password">Pozabljeno Geslo?</button>
   <button id="register-button" class="register-button">Niste Registrirani?</button>
 </div>


  <dialog id="register-window" class="register-window">
    <form id="register-form">
      <button class="close-button" type="button">x</button>
      <h2 class="act-create">Create Account</h2>
      <p class="dialog-text">Enter your registration details.</p>

      <input class="register-email" type="email" required placeholder="Email">
      <input class="register-mailpass" type="password" required placeholder="password">
       
      <button class="reg-button" type="submit">Register</button>
    </form>
  </dialog>

  <dialog id="forgotten-password-window" class="forgotten-password-window">
    <form id="forgotten-form">
      <button class="close-button" type="button">x</button>
      <h2 class="act-create">Forgot Your Password?</h2>
      <p class="dialog-text">Enter Your Email</p>

      <input class="register-email" type="email" required placeholder="Email">

      <button class="forgot-pass" type="submit">Send New Password Request</button>
    </form>
  </dialog>



</body>
</html>
